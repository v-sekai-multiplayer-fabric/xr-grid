name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: [self-hosted, harvester, linux, x64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download patched Godot editor
        run: |
          # The multiplayer-fabric Godot editor (double precision, with
          # the multiplayer_fabric module baked in). Built by
          # v-sekai-multiplayer-fabric/godot-images.
          mkdir -p /tmp/godot-editor
          podman pull ghcr.io/v-sekai-multiplayer-fabric/godot-editor-double:latest
          # Extract the editor binary from the container image.
          CID=$(podman create ghcr.io/v-sekai-multiplayer-fabric/godot-editor-double:latest)
          podman cp "$CID:/usr/local/bin/godot" /tmp/godot-editor/godot || \
            podman cp "$CID:/godot/bin/godot.linuxbsd.editor.double.x86_64" /tmp/godot-editor/godot || \
            echo "WARN: could not find editor binary; listing container root" && podman cp "$CID:/" /tmp/godot-editor-dump
          podman rm "$CID"
          chmod +x /tmp/godot-editor/godot || true
          ls -la /tmp/godot-editor/

      - name: Import project
        run: |
          /tmp/godot-editor/godot --headless --import . 2>&1 || true

      - name: Export (Linux)
        run: |
          mkdir -p releases
          /tmp/godot-editor/godot --headless --export-release "Linux" releases/xr-grid.x86_64 2>&1 || \
            echo "Export failed or no Linux preset; trying default" && \
            /tmp/godot-editor/godot --headless --export-release "" releases/xr-grid 2>&1 || true
          ls -lh releases/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xr-grid-${{ github.sha }}
          path: releases/
          retention-days: 14
