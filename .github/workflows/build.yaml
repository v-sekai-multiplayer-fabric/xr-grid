name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: [self-hosted, harvester, linux, x64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download patched Godot editor
        run: |
          # The multiplayer-fabric Godot editor (double precision, with
          # the multiplayer_fabric module baked in). Built by
          # v-sekai-multiplayer-fabric/godot-images.
          #
          # Use `docker` (not `podman`) because the runner container's
          # filesystem is overlayfs-on-overlayfs, and podman can't use
          # the overlay driver there. `docker` talks to the HOST's
          # podman via the mounted socket, which has a real filesystem.
          mkdir -p /tmp/godot-editor
          sudo docker pull ghcr.io/v-sekai-multiplayer-fabric/godot-editor-double:latest
          CID=$(sudo docker create ghcr.io/v-sekai-multiplayer-fabric/godot-editor-double:latest)
          sudo docker cp "$CID:/usr/local/bin/godot" /tmp/godot-editor/godot 2>/dev/null || \
            sudo docker cp "$CID:/godot/bin/godot.linuxbsd.editor.double.x86_64" /tmp/godot-editor/godot 2>/dev/null || \
            { echo "=== Could not find editor. Listing container FS ==="; sudo docker export "$CID" | tar t | grep -i godot | head -20; exit 1; }
          sudo docker rm "$CID"
          chmod +x /tmp/godot-editor/godot
          ls -la /tmp/godot-editor/
          /tmp/godot-editor/godot --version || true

      - name: Import project
        run: |
          /tmp/godot-editor/godot --headless --import . 2>&1 || true

      - name: Export (Linux)
        run: |
          mkdir -p releases
          /tmp/godot-editor/godot --headless --export-release "Linux" releases/xr-grid.x86_64 2>&1 || \
            /tmp/godot-editor/godot --headless --export-release "" releases/xr-grid 2>&1 || true
          ls -lh releases/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xr-grid-${{ github.sha }}
          path: releases/
          retention-days: 14
