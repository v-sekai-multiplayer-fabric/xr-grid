name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: [self-hosted, harvester, linux, x64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download V-Sekai Godot editor
        run: |
          # Use the public V-Sekai/world-godot Linux editor release.
          # For Phase 0 (build pipeline) the multiplayer_fabric module
          # isn't needed. Phase 1+ will switch to the patched engine
          # once the ghcr.io package is made public.
          mkdir -p /tmp/godot-editor
          curl -fsSL -o /tmp/godot-editor/editor.zip \
            "https://github.com/V-Sekai/world-godot/releases/download/latest.v-sekai-editor-281/v-sekai-godot-linuxbsd.zip"
          cd /tmp/godot-editor && unzip -o editor.zip && rm editor.zip
          # Find the editor binary
          EDITOR=$(find . -name 'godot*' -type f -executable | head -1)
          if [ -z "$EDITOR" ]; then
            EDITOR=$(find . -name 'godot*' -type f | head -1)
            chmod +x "$EDITOR"
          fi
          ln -sf "$EDITOR" /tmp/godot-editor/godot
          ls -la /tmp/godot-editor/
          /tmp/godot-editor/godot --version || true

      - name: Import project
        run: |
          /tmp/godot-editor/godot --headless --import . 2>&1 || true

      - name: Export (Linux)
        run: |
          mkdir -p releases
          /tmp/godot-editor/godot --headless --export-release "Linux" releases/xr-grid.x86_64 2>&1 || \
            /tmp/godot-editor/godot --headless --export-release "" releases/xr-grid 2>&1 || true
          ls -lh releases/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xr-grid-${{ github.sha }}
          path: releases/
          retention-days: 14
