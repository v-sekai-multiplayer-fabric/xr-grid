name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: [self-hosted, harvester, linux, x64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download patched Godot editor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Extract the editor binary from the ghcr.io OCI image using
          # crane (no docker daemon needed — works inside containers
          # where docker.sock isn't accessible).
          CRANE_VERSION=v0.20.3
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz crane
          chmod +x crane

          echo "$GH_TOKEN" | ./crane auth login ghcr.io -u token --password-stdin

          mkdir -p /tmp/godot-editor /tmp/godot-image
          ./crane export ghcr.io/v-sekai-multiplayer-fabric/godot-editor-double:latest /tmp/godot-image/fs.tar
          # Find the editor binary inside the exported filesystem.
          tar tf /tmp/godot-image/fs.tar | grep -iE 'godot.*editor|godot.*linuxbsd|godot$' | head -10
          # Extract it (try common paths).
          tar xf /tmp/godot-image/fs.tar -C /tmp/godot-editor \
            --strip-components=3 usr/local/bin/godot 2>/dev/null || \
          tar xf /tmp/godot-image/fs.tar -C /tmp/godot-editor \
            --wildcards '*/godot.linuxbsd.editor*' --strip-components=99 2>/dev/null || \
          { echo "=== Editor not at expected path. Files matching 'godot': ===";
            tar tf /tmp/godot-image/fs.tar | grep -i godot | head -20; exit 1; }
          chmod +x /tmp/godot-editor/godot
          ls -la /tmp/godot-editor/
          /tmp/godot-editor/godot --version || true
          rm -rf /tmp/godot-image ./crane

      - name: Import project
        run: |
          /tmp/godot-editor/godot --headless --import . 2>&1 || true

      - name: Export (Linux)
        run: |
          mkdir -p releases
          /tmp/godot-editor/godot --headless --export-release "Linux" releases/xr-grid.x86_64 2>&1 || \
            /tmp/godot-editor/godot --headless --export-release "" releases/xr-grid 2>&1 || true
          ls -lh releases/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xr-grid-${{ github.sha }}
          path: releases/
          retention-days: 14
